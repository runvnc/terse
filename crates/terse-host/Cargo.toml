[package]
name = "terse-host"
description = "Windowed GPU host for Terse."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "terse-host"
path = "src/main.rs"

[dependencies]
terse-core.workspace = true
terse-net.workspace = true
terse-relay.workspace = true
winit = "0.30"
wgpu = "30"
pollster = "0.4"
fontdue = "0.9"
fontdb = "0.24"
ttf-parser = "0.25"
png = "0.18"
getrandom = "0.4"
gilrs = "0.11"
cosmic-text = "0.19"
swash = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
tempfile = "3"
