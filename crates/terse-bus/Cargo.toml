[package]
name = "terse-bus"
description = "Device bus prototype (DEVICES.md): a small core host running one Terse32 machine, its devices as driver processes."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "terse-bus"
path = "src/main.rs"

[features]
default = ["window"]
# Presents the composed picture in a window (softbuffer); never needed for
# --screenshot or --bench.
window = ["dep:winit", "dep:softbuffer", "dep:arboard", "terse-host/input", "terse-host/audio"]

[dependencies]
terse-core.workspace = true
terse-perflog.workspace = true
terse-net.workspace = true
terse-host.workspace = true
blake3 = { version = "1.8", default-features = false }
getrandom = "0.4"
png = "0.18"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"], optional = true }

# What the bus needs of the operating system (src/sys, DEVICES.md 4.3).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Memory", "Win32_Security", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
terse-relay.workspace = true
