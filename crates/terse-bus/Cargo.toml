[package]
name = "terse-bus"
description = "Device bus prototype (DEVICES.md): a small core host running one Terse machine, its devices as driver processes."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "terse-bus"
path = "src/main.rs"

[features]
default = ["window"]
# Presents the composed picture in a window (softbuffer); never needed for
# --screenshot or --bench.
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
terse-core.workspace = true
terse-net.workspace = true
blake3 = { version = "1.8", default-features = false }
libc = "0.2"
getrandom = "0.4"
png = "0.18"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
terse-relay.workspace = true
