[package]
name = "terse-cli"
description = "Headless Terse32 runner, image tools and feeds for Tersenet."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "terse"
path = "src/main.rs"

[dependencies]
terse-core.workspace = true
terse-perflog.workspace = true
terse-net.workspace = true
terse-relay.workspace = true

# `terse perf`'s cold start: dropping one file's pages from the page cache;
# `terse node`: signals, the socket's owner and the peer's user ID.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
terse-net.workspace = true
terse-relay.workspace = true
terse-bus.workspace = true
tempfile = "3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
