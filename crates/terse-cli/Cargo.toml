[package]
name = "terse-cli"
description = "Headless runner and image tools for Terse."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "terse"
path = "src/main.rs"

[dependencies]
terse-core.workspace = true
terse-net.workspace = true
terse-relay.workspace = true

[dev-dependencies]
terse-net.workspace = true
terse-relay.workspace = true
terse-bus.workspace = true
tempfile = "3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
