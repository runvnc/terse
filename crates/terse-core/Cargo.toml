[package]
name = "terse-core"
description = "The Terse virtual machine: Z80, memory, devices and frame loop (no I/O, no threads)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rustzx-z80.workspace = true
blake3 = { version = "1.8", default-features = false }

[dev-dependencies]
rsasm = { version = "0.1.3", default-features = false, features = ["retro"] }
