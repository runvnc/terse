[package]
name = "terse-perflog"
description = "The performance record (RECORD.md): who a host and its devices are, which of them made a frame late, and the rule that does not tolerate it (PERFORMANCE.md R13-R16)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
terse-dirs.workspace = true
blake3 = { version = "1.8", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Wdk_System_SystemServices"] }

[dev-dependencies]
tempfile = "3"
terse-testkit.workspace = true
