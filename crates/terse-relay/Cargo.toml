[package]
name = "terse-relay"
description = "WebSocket blob relay for Terse (NETWORK.md section 3)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "terse-relay"
path = "src/main.rs"

[dependencies]
terse-net.workspace = true
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"
terse-core.workspace = true
