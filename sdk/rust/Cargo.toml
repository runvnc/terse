[package]
name = "tersenet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Checks Tersenet feed entries: every validity rule, with strict Ed25519 verification."
repository = "https://github.com/runvnc/terse"
keywords = ["ed25519", "signature", "tersenet", "no_std"]
categories = ["cryptography", "no-std"]
readme = "README.md"
# The tests read ../testdata and the repository's vectors: not packaged.
include = ["src", "README.md", "LICENSE"]

[dependencies]
curve25519-dalek = { version = "4.1", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
ed25519-dalek = "2.2"
