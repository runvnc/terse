[workspace]
resolver = "3"
members = [
    "crates/terse-core",
    "crates/terse-net",
    "crates/terse-relay",
    "crates/terse-cli",
    "crates/terse-host",
    "crates/terse-bus",
    "crates/terse-devices",
    "crates/terse-perflog",
    "crates/terse-mame-crt",
    "crates/terse-testkit",
    "crates/terse-dirs",
    "sdk/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
terse-core = { path = "crates/terse-core" }
terse-net = { path = "crates/terse-net" }
terse-relay = { path = "crates/terse-relay" }
terse-bus = { path = "crates/terse-bus", default-features = false }
terse-host = { path = "crates/terse-host", default-features = false }
terse-perflog = { path = "crates/terse-perflog" }
terse-testkit = { path = "crates/terse-testkit" }
terse-dirs = { path = "crates/terse-dirs" }

# Debug info is off to keep target/ small: with it on, each test binary was
# about 270 MB. For a build that needs a debugger, turn it on for that build:
#   CARGO_PROFILE_DEV_DEBUG=true cargo build ...
[profile.dev]
debug = false

[profile.dev.package.terse-core]
opt-level = 3

# terse-host's drawing is timed by its window tests (--drive: no frame late
# in the phosphor style's look, the picture still when idle); unoptimised it
# takes several times a frame, so those tests would measure the build, not
# the look.
[profile.dev.package.terse-host]
opt-level = 2
