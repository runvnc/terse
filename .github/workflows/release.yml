# Builds the downloads (RELEASING.md). Pushing a tag v* also makes a draft
# GitHub Release with them; running it by hand (workflow_dispatch) only
# uploads them to the run, as the artifact "terse-downloads".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A tag v1.2.3 names the files 1.2.3; a run by hand names them dev-<commit>.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runners: the host needs this glibc (2.35) or newer.
          - { platform: linux-x86_64, os: ubuntu-22.04, targets: "x86_64-unknown-linux-gnu x86_64-unknown-linux-musl" }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm, targets: "aarch64-unknown-linux-gnu aarch64-unknown-linux-musl" }
          # One Apple silicon runner builds both architectures (universal binaries).
          - { platform: macos, os: macos-15, targets: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { platform: windows-x86_64, os: windows-latest, targets: "x86_64-pc-windows-msvc" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Version
        run: |
          v="${VERSION#v}"
          if [[ "$v" == dev-* ]]; then v="${v:0:11}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            if [ "$cargo_version" != "$v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($cargo_version); see RELEASING.md"
              exit 1
            fi
          fi

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.targets }}
          rustc --version

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # udev (game controllers) for the host (sound needs nothing to
          # build with: it is loaded at run time); musl for
          # the static command-line tools.
          sudo apt-get install -y --no-install-recommends libudev-dev musl-tools pkg-config

      - name: Build and package
        run: scripts/release/build.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  reader:
    name: tersereader
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Version
        run: |
          v="${VERSION#v}"
          if [[ "$v" == dev-* ]]; then v="${v:0:11}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build and package
        run: scripts/release/build.sh reader
      - uses: actions/upload-artifact@v4
        with:
          name: download-tersereader
          path: dist/*
          if-no-files-found: error

  # All downloads with their checksums, as one artifact of the run.
  checksums:
    needs: [build, reader]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: terse-downloads
          path: dist/*
          if-no-files-found: error

  # A tag only: a draft release, for the owner to check and publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: terse-downloads
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          sed -e "s/@VERSION@/$v/g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" packaging/release-notes.md > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun: replace the files of the existing (draft) release.
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "Tersenet $v" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
