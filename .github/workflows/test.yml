# Runs the workspace's tests on Linux, macOS and Windows, by hand only
# (Actions, "test", "Run workflow"; or gh workflow run test.yml --ref <branch>).
# The bus tests (crates/terse-devices, crates/terse-bus) run three times on
# Linux and macOS: as they are, with every end sleeping on the socket and no
# process timing (TERSE_BUS_WAKE=socket, what Windows always does, DEVICES.md
# 4.3; TERSE_PERF_PROBE=none, a system that tells no CPU wait), and with the
# drivers on the socket transport only. On Windows the CPU wait is inferred
# from cycle counts (RECORD.md 4): terse-perflog's Windows-only test checks
# the readings. Then each system drives hello, sparks and the sheet in
# terse-host's real window (scripts/drive-shots.py, the software renderer:
# in a headless weston on Linux, on the runner's own desktop on macOS and
# Windows) and keeps the pictures and the performance records as the
# artifact window-pictures-<os>; the step fails only if a script's
# expectation fails or a drive cannot finish, not for want of a GPU. Tests that need a GPU, a window, fonts or a tool the runner lacks skip
# themselves as they do anywhere, each one recorded; the last step lists them
# (scripts/test-skips.py). On Linux every tool is installed and the main test
# step runs with TERSE_TEST_NO_SKIP=1: a skip there fails, except a missing
# graphics adapter. Then the C core and example driver (POSIX: Linux and
# macOS) and the Go reader's tests, on release programs they check are not
# older than their sources.
name: test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout as stored
        # .gitattributes turns off line-ending conversion: no file may be
        # checked out with CRLF where the repository has LF.
        run: |
          git config --show-origin --get-all core.autocrlf || true
          if git ls-files --eol | grep -E "i/lf +w/crlf"; then exit 1; fi

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # udev (game controllers) for the host's window (sound is loaded at run time);
          # fonts (the pictures, CJK coverage) and lavapipe (a software GPU
          # adapter for wgpu) so that those tests run instead of skipping.
          sudo apt-get install -y --no-install-recommends libudev-dev pkg-config \
            fonts-dejavu-core fonts-noto-cjk mesa-vulkan-drivers
          # The RISC-V tools at the version the checked-in images were built
          # with (README: clang and LLD 23), first on the PATH.
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          sudo apt-get install -y --no-install-recommends lld-23 llvm-23
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          rustup target add riscv32imc-unknown-none-elf

      # Before the workspace's tests: terse-cli's node tests build the Go
      # reader.
      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version-file: native/reader-go/go.mod
          cache: false

      - name: Skip log
        run: python3 scripts/test-skips.py --clear || python scripts/test-skips.py --clear

      - name: Build
        run: cargo build --locked --workspace --all-targets

      # The tests build any other package's program they run themselves
      # (crates/terse-testkit): they do not depend on the step above.
      - name: Test the workspace
        env:
          TERSE_TEST_NO_SKIP: ${{ runner.os == 'Linux' && '1' || '' }}
          TERSE_TEST_ALLOW_SKIP: gpu,weston
        run: cargo test --locked --workspace --no-fail-fast -- --test-threads 4

      - name: Weston, for the window pictures
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: sudo apt-get install -y --no-install-recommends weston

      - name: Window pictures (terse-host --drive)
        if: ${{ !cancelled() }}
        env:
          # macOS and Windows have no headless display: the window shows on
          # the runner's desktop, which nobody uses. Never set this on a
          # developer's machine (README "Driving the window").
          TERSE_DRIVE_DISPLAY: ${{ runner.os != 'Linux' && 'current' || '' }}
          TERSE_AUDIO: "off"
        run: |
          if python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          exe=target/debug/terse-host
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          "$py" scripts/drive-shots.py "$exe" window-pictures

      - name: Keep the window pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: window-pictures-${{ matrix.os }}
          path: window-pictures
          if-no-files-found: warn

      - name: Bus tests, every end sleeping on the socket, no process timing
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        env:
          TERSE_BUS_WAKE: socket
          TERSE_PERF_PROBE: none
        run: cargo test --locked -p terse-bus -p terse-devices -p terse-perflog --no-fail-fast -- --test-threads 4

      - name: Bus tests, the socket transport only
        if: ${{ !cancelled() }}
        env:
          TERSE_BUS_TRANSPORT: socket
        run: cargo test --locked -p terse-devices --no-fail-fast -- --test-threads 4

      - name: Release programs for the native tests
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: cargo build --locked --release --workspace --bins

      - name: C core (native/core-c)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: |
          cd native/core-c
          make
          ./test.sh

      - name: Example driver (native/driver-example)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        run: native/driver-example/test.sh

      - name: Go reader (native/reader-go)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        env:
          TERSE_BIN_DIR: ${{ github.workspace }}/target/release
          TERSE_TEST_NO_SKIP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          cd native/reader-go
          go test ./...

      - name: Skipped tests
        if: always()
        run: python3 scripts/test-skips.py || python scripts/test-skips.py
